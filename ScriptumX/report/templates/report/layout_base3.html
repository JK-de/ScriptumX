<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="description" content="{{ title }}" />
    <meta name="keywords" content="ScriptumX, movie, script, {{ title }}" />
    
    <title>{{ title }} - Scriptum&#x1d4e7;</title>
    {% load static %}

    {% if not PDF %}

    <link rel="stylesheet" href="{% static 'vendor/font-awesome/css/font-awesome.min.css' %}">
    
    <link rel="stylesheet" type="text/css" href="{% static 'X/content/bootstrap.min.css' %}" />

    <script src="{% static 'vendor/jquery/jquery-2.2.4.min.js' %}"></script>
    <script src="{% static 'X/scripts/bootstrap.min.js' %}"></script>
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}">

    <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,400italic,700,700italic' rel='stylesheet' type='text/css'>

    {% endif %}

    <style>
        @media print
        {    
            .no-print, .no-print * {
                display: none !important;
            }
        }
        body {
            /*overflow-x:hidden;*/ 
            /*overflow-y:auto;*/ 
            background-color:#BBB;
            /*font-family: Roboto, sans-serif;*/
            font-family: 'Source Sans Pro', sans-serif;
            /*font-family: 'Magra', sans-serif;*/
            /*font-family: 'Fira Sans', sans-serif;*/
            text-shadow: none;
        }
    </style>

    {% block base_head %}{% endblock %}

</head>

<body>

    {% block base_body %}{% endblock %}

    {% if not PDF %}

    <script type="text/javascript">
        $(document).ready(function(){
            $('#printbutton').click(function (event) {
                event.preventDefault();
                window.print();
            });
        });
    </script>

    {% endif %}

</body>
</html>
