{% extends "report/layout_L.html" %}
{% block content %}
<div class="container" style="max-width:720px; margin-top:40px;">
  <div class="panel panel-info">
    <div class="panel-heading">
      <h3>{{ title }}</h3>
    </div>
    <div class="panel-body">
      <p>Saved filter preset <strong>{{ preset.name }}</strong>
        for group <code>{{ preset.tag_group }}</code>
        {% if report_title %}(from {{ report_title }}){% endif %}.</p>
      <p>Load it anytime from the report filter form’s preset dropdown.</p>
      <p>
        <a class="btn btn-default" href="javascript:history.back()">Back to filters</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
