{% extends "web/layout.html" %}
{% block content %}
<div class="container" style="max-width:480px; margin-top:32px">
  <h2>Forgot password</h2>
  <p>Enter your account email. If mail is configured, you will receive a reset link. Passwords are never sent by email.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Send reset link</button>
  </form>
</div>
{% endblock %}
